# ========================
# Test för att se om filen läses
# ========================
spring.application.name=booking-system-TEST-2026

# ========================
# MySQL Database Configuration
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/booking_system?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=booking_user
spring.datasource.password=booking_password_123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Logging
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc=DEBUG

server.port=8080