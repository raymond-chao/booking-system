<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}">
  <title th:text="${pageTitle}"></title>
</head>

<body>
<div th:fragment="content">

  <div class="max-w-2xl mx-auto px-6 py-12">
    <div class="bg-white rounded-2xl shadow-lg p-8">

      <div class="text-center mb-8">
        <i class="fas fa-magnifying-glass text-6xl text-amber-600 mb-4"></i>
        <h1 class="text-4xl font-bold mb-2">Hitta din bokning</h1>
        <p class="text-gray-600">
          Ange namn och bokningsnummer för att ändra eller avboka din bokning.
        </p>
      </div>

      <p th:if="${error}"
         class="bg-red-100 border border-red-300 text-red-700 rounded-xl p-4 mb-6"
         th:text="${error}">
      </p>

      <form th:action="@{/bookings/search}" method="post" class="space-y-6">

        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
            Namn
          </label>
          <input id="name"
                 name="name"
                 type="text"
                 required
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
                 placeholder="Ditt fullständiga namn">
        </div>

        <div>
          <label for="bookingConfirmation" class="block text-sm font-semibold text-gray-700 mb-2">
            Bokningsnummer
          </label>
          <input id="bookingConfirmation"
                 name="bookingConfirmation"
                 type="text"
                 required
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
                 placeholder="Exempel: 482913">
        </div>

        <button type="submit"
                class="w-full bg-amber-600 hover:bg-amber-700 text-white px-8 py-4 rounded-xl font-semibold transition">
          Hitta bokning
        </button>

      </form>

    </div>
  </div>

</div>
</body>
</html>
