<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}">
    <title>Mitt konto</title>
</head>

<body class="bg-gray-50">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="max-w-4xl mx-auto px-6 py-10">

    <div class="bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-4xl font-bold mb-6">
            <i class="fas fa-user-cog text-amber-600 mr-3"></i>
            Mitt konto
        </h1>

        <div class="grid md:grid-cols-2 gap-6">

            <!-- PROFILE -->
            <div class="border rounded-2xl p-6">
                <h2 class="text-2xl font-semibold mb-4">
                    Profil
                </h2>

                <p class="mb-3">
                    <span class="font-semibold">Email:</span>
                    <span th:text="${email}"></span>
                </p>

                <a href="/account/edit"
                   class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-3 rounded-xl inline-block transition">
                    Ändra uppgifter
                </a>
            </div>

            <!-- BOOKINGS -->
            <div class="border rounded-2xl p-6">
                <h2 class="text-2xl font-semibold mb-4">
                    Mina bokningar
                </h2>

                <p class="text-gray-600 mb-4">
                    Här kan du se dina bokningar.
                </p>

                <a href="/my-bookings"
                   class="bg-gray-900 hover:bg-black text-white px-5 py-3 rounded-xl inline-block transition">
                    Visa bokningar
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
